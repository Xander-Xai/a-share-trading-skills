name: A-share Daily Monitor

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "runtime/**"
      - "src/**"
      - "configs/**"
      - ".github/workflows/a-share-daily-monitor.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "src/**"
      - "configs/**"
      - ".github/workflows/a-share-daily-monitor.yml"
  schedule:
    # 15:40 Asia/Shanghai = 07:40 UTC. GitHub cron may run with queue delay.
    # This is an EOD research monitor/sample-evidence schedule, not precision intraday execution.
    - cron: "40 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: a-share-daily-monitor-${{ github.ref }}
  # During runtime development, keep evidence only for the newest revision.
  # Scheduled daily runs normally do not overlap.
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtime/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r runtime/requirements.txt
          python -m pip check

      - name: Compile runtime and production source
        run: python -m compileall -q runtime src

      - name: Run unit tests
        run: python -m unittest discover -s runtime/tests -v

      # Pull-request CI must be deterministic and must not depend on live public
      # market endpoints. Live-provider behavior is exercised by scheduled,
      # workflow_dispatch and main-push monitor runs; PRs validate code/contracts.
      - name: Run fail-closed market monitor
        if: github.event_name != 'pull_request'
        run: python runtime/daily_monitor.py

      # Sample collection runs after the market monitor so the sample record can
      # reuse the same day's market-regime evidence. It collects public evidence
      # only and never creates an executable order permission.
      - name: Collect short-mid sample evidence
        if: github.event_name != 'pull_request'
        run: python runtime/sample_collector.py

      # Data maturity is coverage/auditability only. It must never be interpreted
      # as alpha validation or as permission to increase risk.
      - name: Report short-mid sample data maturity
        if: github.event_name != 'pull_request'
        run: python runtime/sample_maturity.py

      - name: Commit report, market history and sample evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never attach evidence generated by stale implementation/config code to
          # a newer revision. A later push/schedule will regenerate it.
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- runtime src configs .github/workflows/a-share-daily-monitor.yml; then
            echo "Runtime/source/config/workflow changed during this run; skip stale report commit."
            exit 0
          fi

          if [ -d reports/daily ]; then
            git add reports/daily
          fi
          if [ -f runtime/state/market_history.csv ]; then
            git add runtime/state/market_history.csv
          fi
          if [ -d runtime/state/sample_evidence ]; then
            git add runtime/state/sample_evidence
          fi

          if git diff --cached --quiet; then
            echo "No monitor/sample changes to commit."
            exit 0
          fi

          git commit -m "chore: update A-share daily monitor and sample evidence"
          git pull --rebase origin main
          git push origin HEAD:main
