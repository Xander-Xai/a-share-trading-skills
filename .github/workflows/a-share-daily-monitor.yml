name: A-share Daily Monitor

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "runtime/**"
      - "src/**"
      - "configs/**"
      - "shared/**"
      - "skills/**"
      - "research/**"
      - "README.md"
      - ".github/workflows/a-share-daily-monitor.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "src/**"
      - "configs/**"
      - "shared/**"
      - "skills/**"
      - "research/**"
      - "README.md"
      - ".github/workflows/a-share-daily-monitor.yml"
  schedule:
    # 15:40 Asia/Shanghai = 07:40 UTC. GitHub cron may run with queue delay.
    # This is an EOD research monitor/sample-evidence schedule, not precision intraday execution.
    - cron: "40 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: a-share-daily-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtime/requirements.txt

      - name: Run repository governance audit
        run: python runtime/repository_consistency_audit.py

      - name: Install dependencies
        run: |
          python -m pip install -r runtime/requirements.txt
          python -m pip check

      - name: Compile runtime and production source
        run: python -m compileall -q runtime src

      - name: Run unit tests
        run: python -m unittest discover -s runtime/tests -v

      - name: Run public market-only monitor
        if: github.event_name != 'pull_request'
        run: python -m runtime.daily_monitor --market-only

      # Primary history adapters use Eastmoney; resilient adapter falls back to
      # Tencent history/index data when the primary endpoint is unavailable.
      # Public-data failure may reduce evidence quality but never authorizes an order.
      - name: Collect short-mid sample evidence
        if: github.event_name != 'pull_request'
        run: python -m runtime.sample_collector_resilient

      - name: Report short-mid sample data maturity
        if: github.event_name != 'pull_request'
        run: python -m runtime.sample_maturity

      - name: Upload public market history
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-market-history
          path: runtime/state/market_history.csv
          if-no-files-found: error
          retention-days: 1

  publish-evidence:
    if: github.event_name != 'pull_request'
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout latest protected main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Download public market history
        uses: actions/download-artifact@v4
        with:
          name: public-market-history
          path: ${{ runner.temp }}/public-market-history

      - name: Create or update public market evidence PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- runtime src configs shared skills research README.md .github/workflows; then
            echo "Runtime/source/config/workflow changed during this run; skip stale evidence."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          registry = json.loads(Path("configs/governance/current-state.json").read_text(encoding="utf-8"))
          if registry.get("runtime", {}).get("auto_order") is not False:
              sys.exit("AUTO_ORDER must remain false")
          if registry.get("scheduled_evidence_allowlist") != ["runtime/state/market_history.csv"]:
              sys.exit("Scheduled evidence allowlist does not match the reviewed single-path contract")
          PY

          allowed_path="runtime/state/market_history.csv"
          # A single-file artifact is rooted at its parent; download-artifact
          # therefore yields market_history.csv directly under this directory.
          artifact_path="$RUNNER_TEMP/public-market-history/market_history.csv"
          python - <<'PY'
          import os
          from pathlib import Path
          import sys

          root = Path(os.environ["RUNNER_TEMP"]) / "public-market-history"
          files = {path.relative_to(root).as_posix() for path in root.rglob("*") if path.is_file()}
          if files != {"market_history.csv"}:
              sys.exit(f"Refusing unexpected artifact contents: {sorted(files)}")
          if any(path.is_symlink() for path in root.rglob("*")):
              sys.exit("Refusing symlinks in the public evidence artifact")
          PY
          if [ ! -s "$artifact_path" ]; then
            echo "Public market history artifact is missing or empty."
            exit 1
          fi

          branch="automation/public-market-evidence"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            git checkout -B "$branch" origin/main
          fi
          mkdir -p "$(dirname "$allowed_path")"
          cp "$artifact_path" "$allowed_path"

          python - <<'PY'
          import subprocess
          import sys

          allowed = b"runtime/state/market_history.csv"
          probes = (
              ("git", "diff", "--name-only", "-z"),
              ("git", "ls-files", "--others", "--exclude-standard", "-z"),
          )
          changed = set()
          for command in probes:
              changed.update(path for path in subprocess.check_output(command).split(b"\0") if path)
          unexpected = changed - {allowed}
          if unexpected:
              sys.exit(f"Refusing generated evidence outside allowlist: {sorted(unexpected)!r}")
          PY

          git add -- "$allowed_path"
          python - <<'PY'
          import subprocess
          import sys

          allowed = b"runtime/state/market_history.csv"
          changed = {path for path in subprocess.check_output(
              ("git", "diff", "--cached", "--name-only", "-z")
          ).split(b"\0") if path}
          if changed - {allowed}:
              sys.exit(f"Refusing staged paths outside allowlist: {sorted(changed - {allowed})!r}")
          PY

          if git diff --cached --quiet; then
            echo "No evidence delta remains after syncing the existing evidence branch."
            exit 0
          fi

          git commit -m "chore: update public market evidence"
          git push origin "$branch"
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore: update public market evidence" \
              --body "Generated by the scheduled Daily Monitor workflow. Public market-wide aggregate evidence only; AUTO_ORDER=false; no private candidate data is included. Allowed generated path: runtime/state/market_history.csv."
          else
            echo "Updated existing public market evidence PR #$pr_number."
          fi
